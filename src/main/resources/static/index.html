<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encurtador de Links</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="card">
            <h1>Encurtador de Links</h1>
            <p class="subtitle">Cole uma URL e gere um link curto.</p>

            <form id="form-link">
                <label for="url">URL original</label>
                <div class="input-row">
                    <input
                        id="url"
                        name="url"
                        type="url"
                        placeholder="https://exemplo.com"
                        required
                    >
                    <button type="submit">Encurtar</button>
                </div>
            </form>

            <p id="mensagem" class="mensagem"></p>

            <section id="resultado" class="resultado hidden">
                <h2>Link criado</h2>

                <div class="campo">
                    <span>Link curto</span>
                    <a id="link-curto" href="#" target="_blank" rel="noopener noreferrer"></a>
                </div>

                <div class="campo">
                    <span>Cliques</span>
                    <strong id="cliques">0</strong>
                </div>

                <div class="campo">
                    <span>Criado em</span>
                    <strong id="data-criacao">-</strong>
                </div>

                <button id="atualizar" type="button">
                    Atualizar
                </button>
                <button id="copiar" class="botao-secundario" type="button">
                    Copiar link
                </button>
            </section>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
